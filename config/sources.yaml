# 信息源清单（ADR-0007 双配置驱动；schema 见 ai/design.md §2）
# 每项：name(唯一) + type + url/topic 等；enabled: false 可临时停用
# 类型扩展：出现未支持的 type 时该源跳过并告警，走「调查→适配」流程

sources:
  # ---- CSDN（ADR-0019：so.csdn.net 搜索接口，时间窗+关键词过滤，无需登录）----
  - name: csdn-ai-search
    type: csdn
    mode: search            # 搜博客文章；tm=时间窗(1=当天,2/3=更宽)，days=客户端二次过滤
    query: AI
    tm: 2
    size: 30
    days: 3                 # 只保留近 N 天
    topic: tech
    enabled: true

  # ---- 知乎（ADR-0014/0015：专栏文章 API 与热榜 API 均无需登录）----
  - name: zhihu-ai-columns
    type: zhihu
    mode: column            # 专栏文章流：机构号/作者专栏最新文章（ADR-0015）
    columns: [jiqizhixin, QbitAI, paperweekly]   # 专栏 slug = zhuanlan.zhihu.com/{slug}
    per_column: 10          # 每专栏取最新 N 篇
    rank_by: updated        # updated=按发布时间 | voteup=按点赞热度
    topic: tech
    enabled: true

  - name: zhihu-hot
    type: zhihu
    mode: hot-list          # 全站热榜（最多 30 条）——AI 占比低，默认停用（用户不需要）
    limit: 30
    ai_filter: true
    topic: news
    enabled: false

  # ---- GitHub（已验证，T3/ADR-0012；四个 topic 2026-09-16 实测命中充足）----
  # mode: search=组合查询取热门 | trending=解析 github.com/trending 页（ADR-0013）| repo=跟踪指定仓库
  - name: github-trending-monthly
    type: github
    mode: trending              # 每行自带"本期新增 star"增量数据
    since: monthly              # daily | weekly | monthly
    topic: tech
    enabled: true

  - name: github-codex
    type: github
    mode: search
    query: "topic:codex stars:>50 pushed:>now-30d"
    per_page: 10
    topic: tech
    enabled: true

  - name: github-artificial-intelligence
    type: github
    mode: search
    query: "topic:artificial-intelligence stars:>500 pushed:>now-7d"
    per_page: 10
    topic: tech
    enabled: true

  - name: github-agent-harness
    type: github
    mode: search
    query: "topic:agent-harness stars:>5 pushed:>now-100d"
    per_page: 10
    topic: tech
    enabled: true

  - name: github-ai-agents
    type: github
    mode: search
    query: "topic:ai-agents stars:>300 pushed:>now-7d"
    per_page: 10
    topic: tech
    enabled: true

