# 信息源清单（ADR-0007 双配置驱动；schema 见 ai/design.md §2）
# 每项：name(唯一) + type + url/topic 等；enabled: false 可临时停用
# 类型扩展：出现未支持的 type 时该源跳过并告警，走「调查→适配」流程

sources:
  # ---- arXiv（T16：cs.AI RSS，当日新论文；无排名语义取最新 N 条）----
  - name: arxiv-cs-ai
    type: rss
    url: https://export.arxiv.org/rss/cs.AI
    limit: 10
    topic: tech
    enabled: true

  # ---- 掘金（T16：recommend API 免登录，sort_type=3 即热榜语义；AI 分类 cate_id 已验证）----
  - name: juejin-ai-hot
    type: juejin
    cate_id: "6809637771511070734"   # 人工智能
    sort_type: 3                     # 3=热榜 | 200=最新
    limit: 10
    topic: tech
    enabled: true

  # ---- 国外精选（T2 国外实测 2026-09-18，首批 7+1；英文源走合并翻译）----
  - name: openai-news
    type: rss
    url: https://openai.com/news/rss.xml
    limit: 10
    topic: tech
    enabled: true

  # OpenAI 研究板块（用户指定 2026-09-18）：无 RSS、HTML 反爬 → 走官方 sitemap（URL+lastmod），
  # 标题由 slug 派生并 LLM 润色；只收近 7 天；与 news 源共用 /index/ URL 空间，自动去重
  - name: openai-research
    type: sitemap
    url: https://openai.com/sitemap.xml/research/
    days: 7
    limit: 10
    title: OpenAI Research
    url_include: "/index/"
    topic: tech
    enabled: true

  # Anthropic（用户指定 2026-09-18）：无 RSS 但页面 SSR + 官方 sitemap（534 URL，含 187 条
  # engineering/research，最新到昨日）→ 复用 sitemap 适配器，近 7 天
  - name: anthropic-engineering
    type: sitemap
    url: https://www.anthropic.com/sitemap.xml
    days: 45             # 工程博客约月更，窗口放宽；去重保证不重复收录
    limit: 10
    title: Anthropic Engineering
    url_include: "/engineering/"
    topic: tech
    enabled: true

  - name: anthropic-research
    type: sitemap
    url: https://www.anthropic.com/sitemap.xml
    days: 7
    limit: 10
    title: Anthropic Research
    url_include: "/research/"
    topic: tech
    enabled: true

  - name: deepmind-blog
    type: rss
    url: https://deepmind.google/blog/rss.xml
    limit: 10
    proxy: true          # google 域名直连间歇不稳，统一走代理
    topic: tech
    enabled: true

  # Google Research 博客（2026-09-18 实测：RSS 100 条、当日更新，走代理）
  - name: google-research-blog
    type: rss
    url: https://research.google/blog/rss/
    limit: 10
    proxy: true
    topic: tech
    enabled: true

  # Google 官方博客 AI 频道（用户产品/技术动态，走代理）
  - name: blog-google-ai
    type: rss
    url: https://blog.google/innovation-and-ai/technology/ai/rss/
    limit: 10
    proxy: true
    topic: news
    enabled: true

  - name: techcrunch-ai
    type: rss
    url: https://techcrunch.com/category/artificial-intelligence/feed/
    limit: 10
    topic: news
    enabled: true

  - name: latent-space
    type: rss
    url: https://www.latent.space/feed
    limit: 10
    topic: tech
    enabled: true

  - name: simon-willison
    type: rss
    url: https://simonwillison.net/atom/everything/
    limit: 10
    topic: tech
    enabled: true

  - name: tldr-ai
    type: rss
    url: https://tldr.tech/api/rss/ai
    limit: 10
    topic: news
    enabled: true

  - name: interconnects
    type: rss
    url: https://www.interconnects.ai/feed
    limit: 10
    topic: tech
    enabled: true

  # Mistral（2026-09-18 全通路复检：RSS 自动发现标签给出真实地址 /news/rss——此前猜 .xml 后缀落空）
  - name: mistral-news
    type: rss
    url: https://mistral.ai/news/rss
    limit: 10
    proxy: true
    topic: tech
    enabled: true

  - name: importai
    type: rss
    url: https://importai.substack.com/feed
    limit: 10
    proxy: true          # substack 域名直连不可达，走 SquirrelVPN 代理（2026-09-18 用户开通）
    topic: tech
    enabled: true

  - name: hackernews-top
    type: hn                  # 官方 Algolia API，front_page 按 points 热点排名（ADR-0020 排名语义）
    limit: 10
    topic: tech
    enabled: true

  # ---- RSS（ADR-0020 准入：正规订阅源；feed 自带最新 N 条）----
  # InfoQ 中国（2026-09-18 全通路复检发现 /feed 可用——修正 T15"无接口"结论；中文零 LLM）
  - name: infoq-cn
    type: rss
    url: https://www.infoq.cn/feed
    limit: 10
    topic: tech
    enabled: true

  - name: qbitai-rss
    type: rss
    url: https://www.qbitai.com/feed     # 量子位官网 RSS（2026-09-18 实测活跃）
    limit: 10                            # 最新十条（无排名/热点语义）
    topic: tech
    enabled: true

  # ---- Qwen（T2 国内实测：qwen.ai 为 SPA，合规通道=GitHub org）----
  - name: github-qwen
    type: github
    mode: search
    query: "user:QwenLM pushed:>now-30d"
    per_page: 10
    topic: tech
    enabled: true

  # ---- 国内大模型厂商（T2 实测 2026-09-18：官网均 SPA，合规通道=GitHub org）----
  - name: github-deepseek
    type: github
    mode: search
    query: "user:deepseek-ai pushed:>now-30d"
    per_page: 10
    topic: tech
    enabled: true

  - name: github-zhipu
    type: github
    mode: search
    query: "user:zai-org pushed:>now-30d"
    per_page: 10
    topic: tech
    enabled: true

  - name: github-kimi
    type: github
    mode: search
    query: "user:MoonshotAI pushed:>now-30d"
    per_page: 10
    topic: tech
    enabled: true

  - name: github-bytedance
    type: github
    mode: search
    query: "user:bytedance pushed:>now-30d"
    per_page: 10
    topic: tech
    enabled: true               # 注：org 混有非 AI 仓库，star 排序头部均为 AI；有用性待数据积累后评价

  - name: github-tencent-hunyuan
    type: github
    mode: search
    query: "user:Tencent-Hunyuan pushed:>now-30d"
    per_page: 10
    topic: tech
    enabled: true

  # ---- CSDN（ADR-0019：so.csdn.net 搜索接口，时间窗+关键词过滤，无需登录）----
  - name: csdn-ai-search
    type: csdn
    mode: search            # 搜博客文章；tm=时间窗(1=当天,2/3=更宽)，days=客户端二次过滤
    query: AI
    tm: 2
    size: 30
    days: 3                 # 只保留近 N 天
    topic: tech
    enabled: true

  # ---- 知乎（ADR-0014/0015：专栏文章 API 与热榜 API 均无需登录）----
  - name: zhihu-ai-columns
    type: zhihu
    mode: column            # 专栏文章流：机构号/作者专栏最新文章（ADR-0015）
    columns: [jiqizhixin, QbitAI, paperweekly]   # 专栏 slug = zhuanlan.zhihu.com/{slug}
    per_column: 10          # 每专栏取最新 N 篇
    rank_by: updated        # updated=按发布时间 | voteup=按点赞热度
    topic: tech
    enabled: true

  - name: zhihu-hot
    type: zhihu
    mode: hot-list          # 全站热榜（最多 30 条）——AI 占比低，默认停用（用户不需要）
    limit: 30
    ai_filter: true
    topic: news
    enabled: false

  # ---- GitHub（已验证，T3/ADR-0012；四个 topic 2026-09-16 实测命中充足）----
  # mode: search=组合查询取热门 | trending=解析 github.com/trending 页（ADR-0013）| repo=跟踪指定仓库
  - name: github-trending-monthly
    type: github
    mode: trending              # 每行自带"本期新增 star"增量数据
    since: monthly              # daily | weekly | monthly
    proxy: true                 # github.com 网页直连当日多次超时（2026-09-18 两轮失败），走 VPN 代理
    topic: tech
    enabled: true

  - name: github-codex
    type: github
    mode: search
    query: "topic:codex stars:>50 pushed:>now-30d"
    per_page: 10
    topic: tech
    enabled: true

  - name: github-artificial-intelligence
    type: github
    mode: search
    query: "topic:artificial-intelligence stars:>500 pushed:>now-7d"
    per_page: 10
    topic: tech
    enabled: true

  - name: github-agent-harness
    type: github
    mode: search
    query: "topic:agent-harness stars:>5 pushed:>now-100d"
    per_page: 10
    topic: tech
    enabled: true

  - name: github-ai-agents
    type: github
    mode: search
    query: "topic:ai-agents stars:>300 pushed:>now-7d"
    per_page: 10
    topic: tech
    enabled: true

