# 分发目标清单（ADR-0007；首期仅内部 wiki，ADR-0004 外部通道延后）

channels:
  - name: internal-wiki
    type: mindoc               # 凭据见 ai/secret.md（WIKI_*）
    target: ai-digest          # MinDoc 项目 identify
    mode: full                 # full=全文写入 | card=摘要卡片+链接
    enabled: true

  - name: wecom-group
    type: wecom                # 企业微信群机器人（ADR-0016）；webhook 在 ai/secret.md 的 WECOM_WEBHOOK
    target: ai-digest-group
    mode: card                 # card=markdown 摘要+文档链接
    enabled: false             # 公司无企业微信组织，暂不可用（ADR-0017 修订，代码保留）

  - name: wxpusher-wechat
    type: wxpusher             # WxPusher 主题群发→同事微信（ADR-0017）；凭据 WXPUSHER_APP_TOKEN/TOPIC_ID
    target: ai-digest-topic
    mode: card
    enabled: false             # 拿到 appToken/topicId 后改 true

  # 后续按同样格式追加：
  # - name: team-feishu
  #   type: feishu             # webhook 地址；secret 在 ai/secret.md
  #   target: https://open.feishu.cn/open-apis/bot/v2/hook/xxx
  #   mode: card
  #   enabled: false
