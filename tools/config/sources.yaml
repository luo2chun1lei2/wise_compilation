# 信息源清单（ADR-0007 双配置驱动；schema 见 ai/design.md §2）
# 每项：name(唯一) + type + url/topic 等；enabled: false 可临时停用
# 类型扩展：出现未支持的 type 时该源跳过并告警，走「调查→适配」流程

sources:
  # ---- GitHub（已验证，T3/ADR-0012）----
  - name: github-ai-hot
    type: github
    mode: search                    # search=组合查询取热门；repo=跟踪指定仓库（watch 字段）
    query: "topic:artificial-intelligence stars:>500 pushed:>now-7d"
    per_page: 10
    topic: tech                     # 归入 topics.yaml 的专题
    enabled: true

